/* weekly real series from ledger: Mint vs Retirement, last 8 ISO weeks ending "now" */
var NOW=new Date(2026,8,30);
function weekIndex(d){ var diffDays=Math.floor((NOW-d)/86400000); return Math.floor(diffDays/7); } // 0 = this week
function weeklySeries(){
  var minted=[0,0,0,0,0,0,0,0], retired=[0,0,0,0,0,0,0,0];
  state.ledger.forEach(function(e){
    var wi=weekIndex(e.time); if(wi<0||wi>7) return;
    var idx=7-wi; // chronological order, oldest..newest
    if(e.type==='Mint') minted[idx]+=e.amount;
    if(e.type==='Retirement') retired[idx]+=e.amount;
  });
  return {minted:minted,retired:retired};
}
function weekDelta(series){
  var n=series.length, cur=series[n-1], prev=series[n-2]||0;
  if(prev===0) return {pct:cur>0?100:0,dir:cur>prev?'up':(cur<prev?'down':'flat')};
  var pct=((cur-prev)/prev)*100;
  return {pct:pct,dir:pct>0.01?'up':(pct<-0.01?'down':'flat')};
}

/* ================= charts ================= */
function niceMax(v){if(v<=0)return 10; var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function groupedWeekChart(minted,retired){
  var W=760,H=250,L=48,B=30,T=14,R=8,ph=H-B-T,pw=W-L-R;
  var max=niceMax(Math.max.apply(null,minted.concat(retired))*1.2||10), n=8, gw=pw/n, bw=gw*0.32,gap=gw*0.06;
  var o='<svg viewBox="0 0 '+W+' '+H+'" class="w-full h-auto" role="img" aria-label="'+t('chart_sub')+'">';
  for(var g=0;g<=4;g++){var v=max*g/4,y=T+ph-v/max*ph; o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#EEF2F7"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#64748B">'+fmt(v)+'</text>';}
  for(var i=0;i<n;i++){
    var x0=L+i*gw+gap, y0=T+ph;
    var hM=minted[i]/max*ph, hR=retired[i]/max*ph;
    o+='<rect x="'+x0.toFixed(1)+'" y="'+(y0-hM).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hM.toFixed(1)+'" rx="3" fill="#059669"><title>'+t('legend_minted')+': '+fmt(minted[i])+' tCO2e</title></rect>';
    o+='<rect x="'+(x0+bw+3).toFixed(1)+'" y="'+(y0-hR).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hR.toFixed(1)+'" rx="3" fill="#94A3B8"><title>'+t('legend_retired')+': '+fmt(retired[i])+' tCO2e</title></rect>';
    o+='<text x="'+(x0+bw+1.5).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="#94A3B8">'+(locale==='en'?'W':'M')+(i+1)+'</text>';
  }
  return o+'</svg>';
}
function stackedChart(monthly){
  var W=760,H=250,L=48,B=28,T=10,R=8,ph=H-B-T,max=niceMax(Math.max.apply(null,monthly.map(function(m){return m.all}))*1.05),bw=(W-L-R)/12,M=MONTHS();
  var o='<svg viewBox="0 0 '+W+' '+H+'" class="w-full h-auto" role="img">';
  for(var g=0;g<=4;g++){var v=max*g/4,y=T+ph-v/max*ph; o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#EEF2F7"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#64748B">'+fmt(v)+'</text>';}
  var cols={1:'#0F172A',2:'#94A3B8',3:'#059669'};
  monthly.forEach(function(m,i){var x=L+i*bw+bw*.2,w=bw*.6,y=T+ph;[1,2,3].forEach(function(s){var h=m[s]/max*ph;if(h>0){y-=h;o+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+cols[s]+'" rx="2"><title>'+M[i]+' S'+s+': '+fmt(m[s])+'</title></rect>';}});o+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="'+(m.has?'#64748B':'#CBD5E1')+'">'+M[i]+'</text>';});
  return o+'</svg>';
}
function donut(pct){
  var r=52,c=2*Math.PI*r,p=Math.max(0,Math.min(100,pct)),dash=(p/100*c).toFixed(1);
  return '<svg viewBox="0 0 140 140" class="mx-auto" style="max-width:160px" role="img" aria-label="'+nf1.format(p)+'%">'+
   '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="#EEF2F7" stroke-width="14"/>'+
   '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="#059669" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+dash+' '+c.toFixed(1)+'" transform="rotate(-90 70 70)"/>'+
   '<text x="70" y="72" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A">'+nf1.format(p)+'%</text></svg>';
}

var lockTimer=null;
function startLock(){
  var k=state.tok, row=state.registry.filter(function(r){return r.id===k.rowId})[0], amt=parseFloat(String($('#tokAmt').value).replace(',','.')), cap=Math.min(row.remaining,surplus());
  if(!(amt>0)||amt>cap){toast((locale==='en'?'Amount must be between 1 and ':'Jumlah harus antara 1 dan ')+fmt(cap)+' tCO2e'); return;}
  if(!kybOk()){toast(locale==='en'?'Rejected by ComplianceRegistry: KYB not passed':'Ditolak ComplianceRegistry: KYB belum lolos'); go('settings'); return;}
  k.amount=amt; k.phase='locking'; k.stepIdx=0; k.progress=6; render(); clearInterval(lockTimer);
  lockTimer=setInterval(function(){
    k.stepIdx++; k.progress=Math.min(100,(k.stepIdx)/LOCK_STEPS().length*100);
    if(k.stepIdx>=LOCK_STEPS().length){clearInterval(lockTimer); k.phase='locked'; k.progress=100; k.stepIdx=LOCK_STEPS().length; row.remaining-=amt; k.locked=amt;}
    if(state.view==='tokenize') render();
  },800);
}
function cancelLock(){var k=state.tok,row=state.registry.filter(function(r){return r.id===k.rowId})[0]; if(row&&k.locked) row.remaining+=k.locked; clearInterval(lockTimer); state.tok={rowId:k.rowId,amount:k.locked||k.amount,phase:'idle',stepIdx:-1,progress:0,result:null,locked:0}; render();}
async function doMint(){
  var k=state.tok,row=state.registry.filter(function(r){return r.id===k.rowId})[0],code='CL-'+row.standard+'-0'+state.batchSeq;
  var isig=await guard('ClimaLedger mint '+code+' '+k.amount+' tCO2e'); if(!isig) return;
  k.phase='minting'; render();
  setTimeout(function(){
    var mint=newAddr(),ata=newAddr();
    mkEvent('Attestation',code,k.amount,new Date(),{memo:'attestation 2/3 signer'});
    var ev=mkEvent('Mint',code,k.amount,new Date(),{mint:mint,ata:ata,intentSig:state.wallet.mode==='phantom'?isig:null});
    var h=ensureHolding(code,{project:row.project,project_en:row.project_en,standard:row.standard,vintage:row.vintage});
    h.minted+=k.amount; h.balance+=k.amount; state.batchSeq++;
    k.result={code:code,amount:k.amount,mint:mint,ata:ata,sig:ev.sig,slot:ev.slot,evId:ev.id,intentSig:state.wallet.mode==='phantom'?isig:null};
    k.phase='minted'; k.locked=0; toast((locale==='en'?'Token minted on Solana ':'Token berhasil dicetak di Solana ')+state.cluster+' (simulasi)'); render();

function pdfEsc(s){return String(s).replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\x20-\x7E]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');}
function makePdf(lines){
  var pages=[[]],y=792; lines.forEach(function(L){var lh=L.s+5; if(y-lh<50){pages.push([]);y=792;} y-=lh; pages[pages.length-1].push({t:L.t,s:L.s,b:L.b,y:y});});
  var objs=[],n=pages.length,kids=[]; for(var i=0;i<n;i++) kids.push((5+2*i)+' 0 R');
  objs[0]='<< /Type /Catalog /Pages 2 0 R >>'; objs[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>'; objs[2]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>'; objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold >>';
  pages.forEach(function(pg,i){var stream=pg.map(function(l){return 'BT /F'+(l.b?2:1)+' '+l.s+' Tf 40 '+l.y+' Td ('+pdfEsc(l.t)+') Tj ET';}).join('\n'); objs[4+2*i]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*i)+' 0 R >>'; objs[5+2*i]='<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream';});
  var out='%PDF-1.4\n',offs=[]; objs.forEach(function(o,i){offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n';});
  var xref=out.length; out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'; offs.forEach(function(o){out+=String(o).padStart(10,'0')+' 00000 n \n';});
  out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF'; return new Blob([out],{type:'application/pdf'});
}

  else if(a==='goto-tok'){var row=state.registry.filter(function(r){return r.id===el.dataset.id;})[0]; state.tok={rowId:row.id,amount:Math.min(row.remaining,surplus()),phase:'idle',stepIdx:-1,progress:0,result:null,locked:0}; go('tokenize');}
  else if(a==='tok-start') startLock();
  else if(a==='tok-cancel') cancelLock();
  else if(a==='tok-mint') doMint();
  else if(a==='tok-again'){state.tok={rowId:null,amount:0,phase:'idle',stepIdx:-1,progress:0,result:null,locked:0}; render();}
  else if(a==='m-std'){state.f.mStd=el.dataset.v; render();}
  else if(a==='a-type'){state.f.aType=el.dataset.v; render();}
  else if(a==='buy-open') openBuy(el.dataset.id);
  else if(a==='buy-confirm'){
    var l=state.listings.filter(function(x){return x.id===el.dataset.id;})[0]; if(!l) return;
    var q=parseFloat(String($('#buyQty').value).replace(',','.')),tot=q*l.price*1.005; if(!(q>0)||q>l.available||tot>state.usdc) return;
    var isig=await guard('ClimaLedger buy '+l.code+' '+q+' tCO2e'); if(!isig) return;
    l.available-=q; state.usdc-=tot; var h=ensureHolding(l.code,l); h.balance+=q;
    mkEvent('Pembelian',l.code,q,new Date(),{usdc:tot,price:l.price,intentSig:state.wallet.mode==='phantom'?isig:null});
    if(l.available<=0) state.listings=state.listings.filter(function(x){return x.id!==l.id;});
    closeModal(); toast((locale==='en'?'Purchase of ':'Pembelian ')+fmtA(q)+' tCO2e '+(locale==='en'?'successful, ':'berhasil, ')+usd(tot)+' USDC'); render();
  }
  else if(a==='cancel-listing'){
    var l2=state.listings.filter(function(x){return x.id===el.dataset.id;})[0]; if(!l2) return;
    var h2=findHolding(l2.code); if(h2){h2.balance+=l2.available; h2.listed-=l2.available;}
    mkEvent('Pembatalan',l2.code,l2.available,new Date()); state.listings=state.listings.filter(function(x){return x.id!==l2.id;}); toast(locale==='en'?'Listing cancelled, balance returned':'Listing dibatalkan, saldo kembali'); render();
  }
  else if(a==='list-open') openList(el.dataset.code);
  else if(a==='list-confirm'){
    var h3=findHolding(el.dataset.code),q3=parseFloat(String($('#lsQty').value).replace(',','.')),p3=parseFloat(String($('#lsPrice').value).replace(',','.'));
    if(!h3||!(q3>0)||q3>h3.balance){toast(locale==='en'?'Invalid amount':'Jumlah tidak valid'); return;}
    if(!(p3>0)){toast(locale==='en'?'Invalid price':'Harga tidak valid'); return;}
    var isig3=await guard('ClimaLedger list '+h3.code+' '+q3+' tCO2e'); if(!isig3) return;
    h3.balance-=q3; h3.listed+=q3;
    state.listings.push({id:'own'+(++state.listSeq),code:h3.code,project:h3.project,project_en:h3.project_en,standard:h3.standard,vintage:h3.vintage,available:q3,price:p3,seller:state.wallet.address,mine:true});
    mkEvent('Listing',h3.code,q3,new Date(),{price:p3}); closeModal(); toast(locale==='en'?'Listing created':'Listing dibuat'); go('market');
  }
  else if(a==='retire-open') openRetire(el.dataset.code);
  else if(a==='retire-confirm'){
    var h4=findHolding(el.dataset.code),q4=parseFloat(String($('#rtQty').value).replace(',','.')); if(!h4||!(q4>0)||q4>h4.balance) return;
    var ben=$('#rtBen').value||'-',why=$('#rtWhy').value||'-';
    var isig4=await guard('ClimaLedger retire '+h4.code+' '+q4+' tCO2e'); if(!isig4) return;
    h4.balance-=q4; h4.retired+=q4;
    var ev=mkEvent('Retirement',h4.code,q4,new Date(),{memo:why,intentSig:state.wallet.mode==='phantom'?isig4:null});
    var cert={id:++state.certSeq,code:h4.code,project:h4.project,standard:h4.standard,vintage:h4.vintage,amount:q4,beneficiary:ben,reason:why,sig:ev.sig,slot:ev.slot,time:ev.time};
    state.certs.unshift(cert); render(); toast(locale==='en'?'Retirement successful. Certificate issued.':'Retire berhasil. Sertifikat diterbitkan.'); openCert(cert.id);
  }
  else if(a==='cert-open') openCert(parseInt(el.dataset.id,10));
  else if(a==='cert-pdf') exportCertPdf(parseInt(el.dataset.id,10));
  else if(a==='tx-open') openTx(parseInt(el.dataset.id,10));
  else if(a==='tx-tab'){
    var tb=el.dataset.t; $$('[data-action="tx-tab"]').forEach(function(b){var on=b===el; b.setAttribute('aria-selected',on); b.className=on?'px-3 py-2 border-b-2 border-brand-500 text-brand-700':'px-3 py-2 border-b-2 border-transparent text-slate-400';});
    $$('[data-p]').forEach(function(p){p.hidden=p.dataset.p!==tb;});
  }
  else if(a==='export-csv') exportCsv();
  else if(a==='export-pdf') exportPdf();
  else if(a==='kyb-upload'){state.kybTarget=el.dataset.id; $('#kybFile').value=''; $('#kybFile').click();}
  else if(a==='kyb-approve'){var s=state.kyb.filter(function(x){return x.id===el.dataset.id;})[0]; s.status='verified'; s.detail_id='Disetujui (simulasi)'; s.detail_en='Approved (simulated)'; toast(locale==='en'?'KYB step approved (simulated)':'Langkah KYB disetujui (simulasi)'); render();}
});
$('#kybFile').addEventListener('change',function(){var f=this.files&&this.files[0]; if(!f) return; var s=state.kyb.filter(function(x){return x.id===state.kybTarget;})[0]; if(!s) return; s.status='pending'; s.file=f.name; s.detail_id='Menunggu tinjauan compliance'; s.detail_en='Awaiting compliance review'; toast(locale==='en'?'File uploaded. KYB held pending review.':'Berkas diunggah. KYB ditahan sampai disetujui.'); render();});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='addQty') updateAddPrev();
  else if(id==='mQ'){state.f.mQ=e.target.value; fillMarketRows();}
  else if(id==='aQ'){state.f.aQ=e.target.value; fillAuditRows();}
  else if(id==='offRange'||id==='offNum'){var v=parseFloat(String(e.target.value).replace(/\./g,'').replace(',','.')); if(v>=0){state.offsetPlan=v; if(id==='offRange') $('#offNum').value=v; else $('#offRange').value=v; updateCalc();}}
  else if(id==='tokAmt'){var av=parseFloat(String(e.target.value).replace(',','.'))||0; state.tok.amount=av; var u=$('#tokUnits'); if(u) u.textContent=fmt(av*1000);}
  else if(id==='buyQty') updateBuy();
  else if(id==='rtQty') updateRetire();
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='fMonth'){state.f.tMonth=e.target.value; fillActRows();}
  else if(id==='fScope'){state.f.tScope=e.target.value; fillActRows();}
  else if(id==='addCat') updateAddPrev();
  else if(id==='mSort'){state.f.mSort=e.target.value; fillMarketRows();}
  else if(id==='netSel'){state.cluster=e.target.value; toast('Solana: '+state.cluster); render();}
  else if(id==='tokRow'){var row=state.registry.filter(function(r){return r.id===e.target.value;})[0]; state.tok.rowId=row.id; state.tok.amount=Math.min(row.remaining,surplus()); render();}
  else if(id==='rtOk') updateRetire();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape') closeModal();});

/* initial loading skeleton, then render */
state.previewState='loading'; renderNav(); $('#view').innerHTML=DashboardSkeleton();
setTimeout(function(){ state.previewState='normal'; render(); },550);
})();
</script>
</body>
</html>
